name: FinOrbit CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  IMAGE_LLM: finorbit-llm
  IMAGE_RAG: finorbit-rag
  PYTHON_RAG: "3.11"
  PYTHON_LLM: "3.12"

# Cancel in-flight runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Lint — fast feedback before any tests run
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_LLM }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Lint RAG service
        run: ruff check Finorbit_RAG --select E,F,W --ignore E501 --exit-zero

      - name: Lint LLM service
        run: ruff check Finorbit_LLM/backend --select E,F,W --ignore E501 --exit-zero

  # ──────────────────────────────────────────────────────────────
  # Job 2: Security scan — flag known CVEs in dependencies
  # ──────────────────────────────────────────────────────────────
  security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_LLM }}
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan LLM dependencies
        working-directory: Finorbit_LLM
        run: |
          pip install -e ".[dev]" --quiet
          pip-audit --ignore-vuln GHSA-jfh8-c2jp-c7p7 || true
          # --ignore-vuln silences false positives (e.g. urllib3 in non-network contexts)
          # Remove '|| true' once all CVEs are resolved to make this a hard failure

      - name: Scan RAG dependencies
        working-directory: Finorbit_RAG
        run: |
          pip install -r requirements.txt --quiet
          pip-audit || true

  # ──────────────────────────────────────────────────────────────
  # Job 3: Test RAG service (with real Postgres + pgvector)
  # ──────────────────────────────────────────────────────────────
  test-rag:
    name: Test RAG Service
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: finorbit_rag_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: Finorbit_RAG

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: finorbit_rag_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      LLM_PROVIDER: openai
      LLAMAINDEX_LLM_MODEL: gpt-4o-mini
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EMBEDDING_MODEL: philschmid/bge-base-financial-matryoshka
      EMBEDDING_DIMENSION: "768"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_RAG }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Skip packages unavailable for this Python version
          grep -v "sentence-transformer-rerank" requirements.txt | pip install -r /dev/stdin

      - name: Apply database schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d finorbit_rag_test -f ../Finorbit_RAG/schema.sql

      - name: Run RAG tests
        run: pytest -q --tb=short -x

  # ──────────────────────────────────────────────────────────────
  # Job 4: Test LLM service (unit tests, no live services)
  # ──────────────────────────────────────────────────────────────
  test-llm:
    name: Test LLM Service
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: Finorbit_LLM

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COMPLIANCE_ENABLED: "true"
      ADVISOR_HANDOVER_ENABLED: "false"   # disable handover so unit tests get real responses

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_LLM }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q --tb=short -x --ignore=tests/run_evaluation.py

  # ──────────────────────────────────────────────────────────────
  # Job 5: Evaluation gate — blocks deploy if quality regresses
  # Reads the committed evaluation_report.json (no live services needed)
  # ──────────────────────────────────────────────────────────────
  eval-gate:
    name: Evaluation Quality Gate
    runs-on: ubuntu-latest
    needs: [test-rag, test-llm]

    defaults:
      run:
        working-directory: Finorbit_LLM

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_LLM }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check evaluation thresholds
        # Validates the committed evaluation_report.json against minimum thresholds.
        # Thresholds defined in scripts/ci_eval_check.py:
        #   routing_accuracy >= 0.80
        #   compliance_pass_rate >= 0.75
        #   grounding_accuracy >= 0.60
        run: python scripts/ci_eval_check.py --report tests/evaluation_report.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report-${{ github.sha }}
          path: Finorbit_LLM/tests/evaluation_report.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Job 6: Build and push Docker images to Azure Container Registry
  # Only on push to main (skipped for PRs)
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    needs: eval-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # Enable Docker BuildKit for layer caching
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push LLM image
        uses: docker/build-push-action@v5
        with:
          context: ./Finorbit_LLM
          push: true
          # Layer cache: pull previous layers from registry, push new layers back
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_LLM }}:cache
          cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_LLM }}:cache,mode=max
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_LLM }}:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_LLM }}:latest

      - name: Build and push RAG image
        uses: docker/build-push-action@v5
        with:
          context: ./Finorbit_RAG
          push: true
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_RAG }}:cache
          cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_RAG }}:cache,mode=max
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_RAG }}:${{ steps.tag.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_RAG }}:latest

  # ──────────────────────────────────────────────────────────────
  # Job 7: Deploy to Azure VM via SSH
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Ensure only one deploy runs at a time even if multiple pushes queue up
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/finorbit

            # Pull latest images
            docker login ${{ secrets.ACR_REGISTRY }} \
              -u ${{ secrets.ACR_USERNAME }} \
              -p ${{ secrets.ACR_PASSWORD }}

            docker compose pull

            # Rolling restart — postgres stays up, only app containers restart
            docker compose up -d --no-deps llm rag nginx

            # Wait for containers to be healthy
            sleep 15
            docker compose ps

            # Health check — fails the deploy if service is down
            curl -sf http://localhost/health || (echo "Health check failed" && exit 1)

            echo "Deploy complete: ${{ steps.tag.outputs.tag }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy failed for commit ${{ github.sha }}. Check SSH logs above."
